<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ — Print3D 3D</title>
<style>
  :root {
    --bg-0: #0d1014;
    --bg-1: #161c23;
    --fg: #e8edf3;
    --muted: #93a0ad;
    --line: rgba(255, 255, 255, 0.10);
    --accent: #e8845a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 62% 38%, var(--bg-1), var(--bg-0) 68%);
    color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  .hud {
    position: fixed;
    background: rgba(12, 16, 21, 0.72);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .top {
    top: 18px; left: 18px; right: 18px;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand {
    flex: none;
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 7px 9px;
    border: 1px solid rgba(232, 132, 90, 0.35);
    border-radius: 8px;
  }
  .who { min-width: 0; }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  button, a.btn {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.045);
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  button:hover, a.btn:hover { background: rgba(255, 255, 255, 0.10); border-color: rgba(255,255,255,0.18); }
  button:active, a.btn:active { background: rgba(255, 255, 255, 0.15); }
  button.on, a.btn.on { border-color: rgba(232, 132, 90, 0.55); color: var(--accent); }
  a.btn { text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
  .exportmsg { font-size: 11px; color: var(--muted); margin-left: 4px; }
  select {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.045);
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    padding: 7px 26px 7px 11px;
    border-radius: 8px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  select:focus { outline: none; border-color: rgba(232, 132, 90, 0.55); }
  .revbox {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-right: 10px;
    padding: 3px 5px 3px 12px;
    border: 1px solid rgba(232, 132, 90, 0.5);
    background: rgba(232, 132, 90, 0.1);
    border-radius: 10px;
  }
  .revbox[hidden] { display: none; }
  .revlabel {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
  }
  .revbox select {
    border: none;
    background-color: transparent;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 5px 22px 5px 2px;
    background-position: calc(100% - 9px) 50%, calc(100% - 5px) 50%;
  }
  .revbox select:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .bottom {
    left: 18px; bottom: 18px;
    padding: 9px 12px;
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
  }
  kbd {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 2px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--fg);
  }
  .stats {
    right: 18px; bottom: 18px;
    padding: 10px 12px;
    color: var(--muted);
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: right;
    pointer-events: none;
  }
  .stats b { color: var(--fg); font-weight: 500; }
  .err {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 520px;
    padding: 16px 18px;
    color: #ffb4a2;
    border-color: rgba(255, 120, 90, 0.35);
    white-space: pre-wrap;
  }
  @media (max-width: 720px) {
    .top { flex-wrap: wrap; gap: 10px; }
    .actions { margin-left: 0; }
    .stats { display: none; }
    .bottom { right: 18px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <header class="hud top">
    <div class="brand">Print3D</div>
    <div class="who">
      <h1>__TITLE__</h1>
      <div class="sub" id="sub">__SUBTITLE__</div>
    </div>
    <div class="actions">
      <div class="revbox" id="revBox" hidden>
        <span class="revlabel">版本</span>
        <select id="revSel" aria-label="选择查看的版本"></select>
      </div>
      <button id="reset" type="button" title="恢复初始视角">复位</button>
      <button id="spin" type="button" title="自动缓慢旋转">自旋</button>
      <button id="shot" type="button" title="保存当前视角为 PNG">截图</button>
      <a id="export" class="btn" download title="导出当前版本的 STL">导出 STL</a>
      <span id="exportMsg" class="exportmsg" aria-live="polite"></span>
    </div>
  </header>
  <div class="hud bottom">
    <kbd>左键拖动</kbd> 旋转 · <kbd>右键 / Shift</kbd> 平移 · <kbd>滚轮</kbd> 缩放 · <kbd>双击</kbd> 复位
  </div>
  <div id="stats" class="hud stats"></div>
  <div id="err" class="hud err" hidden></div>
</div>
<script>
(() => {
  "use strict";

  const META = __META_JSON__;
  const REVS = META.revisions || [];
  let current = Math.max(0, REVS.findIndex((entry) => entry.revision === META.revision));
  const canvas = document.getElementById("c");
  const errBox = document.getElementById("err");
  const revSel = document.getElementById("revSel");
  const revBox = document.getElementById("revBox");

  function decodeF32(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
    return new Float32Array(bytes.buffer);
  }

  function fail(message) {
    errBox.hidden = false;
    errBox.textContent = message;
    document.getElementById("stats").hidden = true;
  }

  const gl = canvas.getContext("webgl", {
    antialias: true,
    alpha: false,
    preserveDrawingBuffer: true,
    powerPreference: "high-performance",
  });
  if (!gl) {
    fail("这个浏览器没有可用的 WebGL。\n请打开硬件加速，或用 Chrome / Safari / Firefox 直接打开这个文件。");
    return;
  }
  if (!REVS.length || !REVS.every((entry) => entry.pos && entry.nrm)) {
    fail("模型几何为空。请先调用 model_build 再生成 3D 视图。");
    return;
  }

  function renderStats(entry) {
    document.getElementById("stats").innerHTML =
      "<b>" + entry.triangles.toLocaleString() + "</b> 三角面<br>" +
      "<b>" + entry.bbox_mm.join(" × ") + "</b> mm<br>" +
      "<b>" + entry.volume_cm3.toFixed(2) + "</b> cm³";
  }
  function renderSubtitle(entry) {
    const parts = [entry.label || entry.revision];
    if (entry.created_at) parts.push(entry.created_at.slice(0, 10));
    parts.push("交互式 3D");
    document.getElementById("sub").textContent = parts.join(" · ");
  }

  // ---- WebGL setup -------------------------------------------------------
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
    }
    return shader;
  }

  let program;
  try {
    program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, [
      "attribute vec3 aPos;",
      "attribute vec3 aNrm;",
      "uniform mat4 uMVP;",
      "varying vec3 vNrm;",
      "void main() {",
      "  vNrm = aNrm;",
      "  gl_Position = uMVP * vec4(aPos, 1.0);",
      "}",
    ].join("\n")));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, [
      "precision highp float;",
      "varying vec3 vNrm;",
      "void main() {",
      "  vec3 n = normalize(vNrm);",
      "  if (!gl_FrontFacing) n = -n;",
      "  vec3 l1 = normalize(vec3(0.38, -0.52, 0.76));",
      "  vec3 l2 = normalize(vec3(-0.62, 0.44, 0.36));",
      "  float d1 = max(dot(n, l1), 0.0);",
      "  float d2 = max(dot(n, l2), 0.0);",
      "  float fill = 0.30 + 0.72 * d1 + 0.17 * d2;",
      "  vec3 base = vec3(0.925, 0.495, 0.305);",
      "  vec3 col = pow(base * fill, vec3(0.92));",
      "  gl_FragColor = vec4(col, 1.0);",
      "}",
    ].join("\n")));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "program link failed");
    }
  } catch (error) {
    fail("WebGL 初始化失败：\n" + (error && error.message ? error.message : error));
    return;
  }

  gl.useProgram(program);
  const posBuf = gl.createBuffer();
  const nrmBuf = gl.createBuffer();
  let currentPos = null;

  const aPos = gl.getAttribLocation(program, "aPos");
  const aNrm = gl.getAttribLocation(program, "aNrm");
  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aNrm);
  const uMVP = gl.getUniformLocation(program, "uMVP");

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.clearColor(0.055, 0.072, 0.09, 1);

  // ---- Camera ------------------------------------------------------------
  let center = REVS[current].center_mm.slice();
  let size = Math.max(REVS[current].bbox_mm[0], REVS[current].bbox_mm[1], REVS[current].bbox_mm[2], 1);
  const FOV = 38 * Math.PI / 180;
  const initial = { yaw: 0.72, pitch: 0.42, dist: size * 2.5, target: center.slice() };
  const view = { yaw: initial.yaw, pitch: initial.pitch, dist: initial.dist, target: center.slice() };
  let spin = false;

  function reset() {
    view.yaw = initial.yaw;
    view.pitch = initial.pitch;
    view.dist = initial.dist;
    view.target = center.slice();
    spin = false;
    document.getElementById("spin").classList.remove("on");
  }

  function loadRevision(index) {
    const entry = REVS[index];
    if (!entry) return;
    current = index;
    const pos = decodeF32(entry.pos);
    const nrm = decodeF32(entry.nrm);
    currentPos = pos;
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, nrmBuf);
    gl.bufferData(gl.ARRAY_BUFFER, nrm, gl.STATIC_DRAW);
    gl.vertexAttribPointer(aNrm, 3, gl.FLOAT, false, 0, 0);
    center = entry.center_mm.slice();
    size = Math.max(entry.bbox_mm[0], entry.bbox_mm[1], entry.bbox_mm[2], 1);
    initial.dist = size * 2.5;
    reset();
    renderStats(entry);
    renderSubtitle(entry);
    if (revSel.value !== entry.revision) revSel.value = entry.revision;
    const exportLink = document.getElementById("export");
    if (exportLink) {
      exportLink.href = entry.stl || (entry.revision + "/model.stl");
      exportLink.download = (META.name || "model") + "-" + entry.revision + ".stl";
      exportLink.title = "下载 " + entry.revision + " 的 STL";
    }
  }

  function eye() {
    const cp = Math.cos(view.pitch);
    return [
      view.target[0] + view.dist * cp * Math.cos(view.yaw),
      view.target[1] + view.dist * cp * Math.sin(view.yaw),
      view.target[2] + view.dist * Math.sin(view.pitch),
    ];
  }

  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function norm(a) {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

  function perspective(aspect, near, far) {
    const f = 1 / Math.tan(FOV / 2);
    const nf = 1 / (near - far);
    return [
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0,
    ];
  }

  function lookAt(eyePos, target) {
    const z = norm(sub(eyePos, target));
    const x = norm(cross([0, 0, 1], z));
    const y = cross(z, x);
    return [
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -dot(x, eyePos), -dot(y, eyePos), -dot(z, eyePos), 1,
    ];
  }

  function multiply(a, b) {
    const out = new Float32Array(16);
    for (let col = 0; col < 4; col += 1) {
      for (let row = 0; row < 4; row += 1) {
        let sum = 0;
        for (let k = 0; k < 4; k += 1) sum += a[k * 4 + row] * b[col * 4 + k];
        out[col * 4 + row] = sum;
      }
    }
    return out;
  }

  // ---- Interaction -------------------------------------------------------
  const pointers = new Map();
  let pinchDistance = 0;
  let pinchMid = null;

  function pan(dx, dy) {
    const forward = norm(sub(view.target, eye()));
    const right = norm(cross(forward, [0, 0, 1]));
    const up = cross(right, forward);
    const scale = 2 * view.dist * Math.tan(FOV / 2) / canvas.clientHeight;
    view.target = [
      view.target[0] - right[0] * dx * scale + up[0] * dy * scale,
      view.target[1] - right[1] * dx * scale + up[1] * dy * scale,
      view.target[2] - right[2] * dx * scale + up[2] * dy * scale,
    ];
  }

  canvas.addEventListener("pointerdown", (event) => {
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, button: event.button, shift: event.shiftKey });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDistance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      pinchMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    canvas.classList.add("dragging");
  });

  canvas.addEventListener("pointermove", (event) => {
    const last = pointers.get(event.pointerId);
    if (!last) return;
    const dx = event.clientX - last.x;
    const dy = event.clientY - last.y;
    last.x = event.clientX;
    last.y = event.clientY;

    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const distance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const midX = (a.x + b.x) / 2;
      const midY = (a.y + b.y) / 2;
      view.dist = Math.min(size * 12, Math.max(size * 0.35, view.dist * (pinchDistance / distance)));
      pinchDistance = distance;
      if (pinchMid) pan(midX - pinchMid.x, midY - pinchMid.y);
      pinchMid = { x: midX, y: midY };
      return;
    }

    if (last.button === 2 || last.button === 1 || last.shift || event.shiftKey) {
      pan(dx, dy);
    } else {
      view.yaw -= dx * 0.0075;
      view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + dy * 0.0075));
    }
  });

  function release(event) {
    pointers.delete(event.pointerId);
    if (pointers.size === 0) canvas.classList.remove("dragging");
    pinchDistance = 0;
    pinchMid = null;
  }
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    view.dist = Math.min(size * 12, Math.max(size * 0.35, view.dist * Math.exp(event.deltaY * 0.0012)));
  }, { passive: false });

  canvas.addEventListener("dblclick", reset);
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());

  document.getElementById("reset").addEventListener("click", reset);
  document.getElementById("spin").addEventListener("click", (event) => {
    spin = !spin;
    event.currentTarget.classList.toggle("on", spin);
  });
  document.getElementById("export").addEventListener("click", async (event) => {
    event.preventDefault();
    const link = document.getElementById("export");
    const msg = document.getElementById("exportMsg");
    const filename = (META.name || "model") + "-" + REVS[current].revision + ".stl";
    try {
      if (!currentPos) throw new Error("模型几何尚未加载");
      const count = Math.floor(currentPos.length / 9);
      const buffer = new ArrayBuffer(84 + count * 50);
      const view = new DataView(buffer);
      const header = "Print3D " + (META.name || "model") + " " + REVS[current].revision;
      for (let i = 0; i < 80; i += 1) {
        view.setUint8(i, i < header.length ? header.charCodeAt(i) : 0);
      }
      view.setUint32(80, count, true);
      let offset = 84;
      const ax = [0, 0, 0], bx = [0, 0, 0], nx = [0, 0, 0];
      for (let t = 0; t < count; t += 1) {
        const base = t * 9;
        for (let k = 0; k < 3; k += 1) {
          ax[k] = currentPos[base + 3 + k] - currentPos[base + k];
          bx[k] = currentPos[base + 6 + k] - currentPos[base + k];
        }
        nx[0] = ax[1] * bx[2] - ax[2] * bx[1];
        nx[1] = ax[2] * bx[0] - ax[0] * bx[2];
        nx[2] = ax[0] * bx[1] - ax[1] * bx[0];
        const len = Math.hypot(nx[0], nx[1], nx[2]) || 1;
        for (let k = 0; k < 3; k += 1) view.setFloat32(offset + k * 4, nx[k] / len, true);
        offset += 12;
        for (let v = 0; v < 9; v += 1) {
          view.setFloat32(offset, currentPos[base + v], true);
          offset += 4;
        }
        view.setUint16(offset, 0, true);
        offset += 2;
      }
      const blob = new Blob([buffer], { type: "model/stl" });
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: "STL mesh", accept: { "model/stl": [".stl"] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          if (msg) msg.textContent = "已保存 " + filename;
          return;
        } catch (pickerError) {
          if (pickerError && pickerError.name === "AbortError") return;
        }
      }
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      anchor.style.display = "none";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      if (msg) msg.textContent = "已生成 " + filename + "；若未开始下载，请在系统浏览器中打开此页";
    } catch (error) {
      if (msg) msg.textContent = "导出失败：" + (error && error.message ? error.message : error);
    }
  });

  document.getElementById("shot").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = (META.name || "model") + "-" + REVS[current].revision + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  REVS.forEach((entry, index) => {
    const option = document.createElement("option");
    option.value = entry.revision;
    option.textContent = entry.label || entry.revision;
    option.title = entry.created_at ? entry.created_at.slice(0, 19).replace("T", " ") : "";
    revSel.appendChild(option);
  });
  if (REVS.length > 1) {
    revBox.hidden = false;
    revSel.addEventListener("change", () => {
      const index = REVS.findIndex((entry) => entry.revision === revSel.value);
      if (index >= 0) loadRevision(index);
    });
  }

  // ---- Render loop -------------------------------------------------------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.round(canvas.clientWidth * dpr);
    const height = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function frame() {
    resize();
    if (spin) view.yaw += 0.004;
    const aspect = canvas.width / Math.max(canvas.height, 1);
    const near = Math.max(view.dist / 100, 0.01);
    const far = view.dist * 20 + size * 20;
    const mvp = multiply(perspective(aspect, near, far), lookAt(eye(), view.target));
    gl.uniformMatrix4fv(uMVP, false, mvp);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, REVS[current].triangles * 3);
    requestAnimationFrame(frame);
  }

  loadRevision(current);
  requestAnimationFrame(frame);
})();
</script>
