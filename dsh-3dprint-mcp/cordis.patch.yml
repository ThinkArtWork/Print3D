- insert:
    - id: 3dprint-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: 3dprint
        transport: stdio
        # `3dprint` must be on PATH (pipx / venv).  For a virtualenv install,
        # replace it with the absolute path, e.g.
        # /Users/you/3DPrint/.venv/bin/3dprint — DSH does not expand `~`.
        # 3DPrint reads PRINT3D_WORKSPACE from env; add it under `env:` only if
        # you keep the workspace outside ~/.3dprint.
        command: 3dprint
        args: ['serve', '--stdio']
        failOnStartupError: true
