- insert:
    - id: print3d-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: print3d
        transport: stdio
        # `print3d` must be on PATH (pipx / venv).  For a virtualenv install,
        # replace it with the absolute path, e.g.
        # /Users/you/Print3D/.venv/bin/print3d — DSH does not expand `~`.
        # Print3D reads PRINT3D_WORKSPACE from env; add it under `env:` only if
        # you keep the workspace outside ~/.print3d.
        command: print3d
        args: ['serve', '--stdio']
        failOnStartupError: true
