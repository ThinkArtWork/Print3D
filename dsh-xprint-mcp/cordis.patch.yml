- insert:
    - id: xprint-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: xprint
        transport: stdio
        # `xprint` must be on PATH (pipx / venv).  For a virtualenv install,
        # replace it with the absolute path, e.g.
        # /Users/you/XPrint/.venv/bin/xprint — DSH does not expand `~`.
        # XPrint reads XPRINT_WORKSPACE from env; add it under `env:` only if
        # you keep the workspace outside ~/.xprint.
        command: xprint
        args: ['serve', '--stdio']
        failOnStartupError: true
