[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Print3D"
version = "0.1.0"
description = "Self-hosted 3D printing MCP server: generate, edit, render, slice, print."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Print3D project" }]
keywords = ["mcp", "3d-printing", "cad", "slicer", "klipper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "build123d>=0.9,<1",
  "trimesh>=4",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.6",
  # httpx needs this when the shell exports ALL_PROXY=socks5://... (docs/RELEASE.md 0.1)
  "socksio>=1.0",
]

[project.scripts]
print3d = "print3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: needs real hardware or installed third-party apps",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["print3d"]
